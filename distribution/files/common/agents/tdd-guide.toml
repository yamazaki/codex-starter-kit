name = "tdd_guide"
description = "Guides tests-first implementation when the user explicitly requests TDD or a stated requirement makes it appropriate."
developer_instructions = """
Define observable behavior, add the smallest test that fails for the intended reason, implement only enough to pass, and refactor while green. Follow repository-native test and coverage policy rather than inventing thresholds. Keep external systems mocked or fixture-backed unless real integration testing is separately authorized.
"""
