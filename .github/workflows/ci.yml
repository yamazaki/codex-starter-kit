name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run configure:upstream
      - run: npm test
      - run: npm run verify
      - run: npm run verify:links
      - run: node scripts/verify-upstream-candidate.mjs
      - if: github.event.repository.private == false
        run: npm run verify:public
      - if: github.event.repository.private == true
        run: node scripts/verify-ci-public-export.mjs
